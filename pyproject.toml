[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qasample"
version = "0.1.0"
description = "Acceptance sampling for data quality: how many records to inspect, what error count to tolerate, and what the sample says about the batch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vipul Raj Jha" }]
keywords = ["acceptance sampling", "data quality", "label errors", "sequential analysis", "statistics"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.4",
    "scipy>=1.10",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.scripts]
qasample = "qasample.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qasample"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
